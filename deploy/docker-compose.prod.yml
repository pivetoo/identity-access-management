services:
  api:
    image: ghcr.io/pivetoo/identity-management-api:latest
    container_name: identity-management-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./config/appsettings.Production.json:/app/appsettings.Production.json:ro
      # Credenciais separadas da configuracao. Opcional no codigo: se o arquivo nao existir, o
      # appsettings.Production.json continua respondendo por tudo.
      - ./config/secrets.Production.json:/app/secrets.Production.json:ro

  web:
    image: ghcr.io/pivetoo/identity-management-web:latest
    container_name: identity-management-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8091:80"
