<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">

  <!--
    Largura total: 240
    Bloco central: ícone (64px) + gap (12px) + divisor (1px) + gap (12px) + texto (~110px) = ~199px
    Início do bloco: (240 - 199) / 2 = ~20px
  -->

  <!-- Ícone do bug: 64x64, começa em x=20, y=8 -->
  <g transform="translate(20, 8) scale(2.0)">
    <style>
      .ic{fill:none;stroke:#000000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;}
    </style>
    <ellipse class="ic" cx="16" cy="16" rx="7" ry="8"/>
    <path class="ic" d="M13,8c0-1.7,1.3-3,3-3s3,1.3,3,3"/>
    <polyline class="ic" points="16,8 16,18 12,22"/>
    <line class="ic" x1="16" y1="18" x2="20" y2="22"/>
    <path class="ic" d="M7,5v0.4c0,2.3,1.1,4.4,3,5.6"/>
    <path class="ic" d="M25,5v0.4c0,2.3-1.1,4.4-3,5.6"/>
    <path class="ic" d="M7,27v-0.4c0-2.3,1.1-4.4,3-5.6"/>
    <path class="ic" d="M25,27v-0.4c0-2.3-1.1-4.4-3-5.6"/>
    <line class="ic" x1="3" y1="16" x2="9" y2="16"/>
    <line class="ic" x1="23" y1="16" x2="29" y2="16"/>
  </g>

  <!-- Divisor vertical: após ícone (20+64=84) + gap 12 = x=96 -->
  <line x1="96" y1="12" x2="96" y2="68" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Texto: começa em x=108, centralizado verticalmente em y=40 -->
  <text x="108" y="40" dominant-baseline="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700"
        fill="#000000" letter-spacing="0.5">Testes <tspan font-weight="400">DEV</tspan></text>

</svg>
